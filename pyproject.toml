[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# PyPI name "gardener" is taken (hook-based tree manipulation library),
# therefore the distribution is named gardener-os; the module and the
# console script stay "gardener".
name = "gardener-os"
version = "0.4.2"
description = "Curated memory for agentic systems: Gardener tames wild systems, knows what belongs to the garden, and makes it searchable."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md", "THIRD_PARTY_LICENSES.txt"]
authors = [{ name = "Lukas Geiger" }]
requires-python = ">=3.10"
keywords = [
    "agent-framework",
    "ai-agent",
    "automation",
    "cli",
    "database-os",
    "fts5",
    "knowledge-management",
    "llm",
    "llm-agents",
    "llm-native",
    "llm-operating-system",
    "local-first",
    "memory-system",
    "open-source",
    "operating-system",
    "python",
    "searchable-memory",
    "sqlite",
    "sqlite-agent-memory",
    "task-management",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Operating System",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/gardener#readme"
Documentation = "https://github.com/ellmos-ai/gardener#readme"
Repository = "https://github.com/ellmos-ai/gardener"
"Source Code" = "https://github.com/ellmos-ai/gardener"
Issues = "https://github.com/ellmos-ai/gardener/issues"
"Bug Tracker" = "https://github.com/ellmos-ai/gardener/issues"
Changelog = "https://github.com/ellmos-ai/gardener/blob/master/CHANGELOG.md"
Security = "https://github.com/ellmos-ai/gardener/blob/master/SECURITY.md"
Notice = "https://github.com/ellmos-ai/gardener/blob/master/NOTICE"
"Parent Organization" = "https://github.com/ellmos-ai"
"Umbrella Ecosystem" = "https://github.com/open-bricks"
Umbrella = "https://github.com/open-bricks"
"LLM Ready" = "https://github.com/ellmos-ai/gardener/blob/master/llms.txt"
"Marketing Log" = "https://github.com/ellmos-ai/gardener/blob/master/MARKETING-LOG.txt"
"Third-Party Licenses" = "https://github.com/ellmos-ai/gardener/blob/master/THIRD_PARTY_LICENSES.md"
"Third-Party Licenses (Text)" = "https://github.com/ellmos-ai/gardener/blob/master/THIRD_PARTY_LICENSES.txt"
"Level 1 SBOM" = "https://github.com/ellmos-ai/gardener/blob/master/THIRD_PARTY_LICENSES.txt"
"Plain-Text License" = "https://github.com/ellmos-ai/gardener/blob/master/LICENSE"

[project.scripts]
gardener = "gardener:main"

[tool.setuptools]
py-modules = ["gardener", "i18n", "seed", "sources", "search_gui", "sleep_union"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
addopts = "-ra -v --basetemp=.pytest_temp"
minversion = "7.0"
norecursedirs = [".git", ".pytest_cache", ".ruff_cache", "workspace", "blobs", ".pytest_temp", ".hypothesis"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "SIM"]
ignore = ["E501"]
